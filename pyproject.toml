[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-worklog"
dynamic = ["version"]
description = "Bounded current frontier and exactly three optional landmark slots for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Worklog contributors"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
               "Programming Language :: Python :: 3.13", "Operating System :: POSIX"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7"]

[project.scripts]
worklog = "worklog.cli:main"

[tool.setuptools.dynamic]
version = {attr = "worklog.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worklog = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["worklog"]
patch = ["subprocess"]
parallel = true
