name: frontier
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      # Coverage counts CLI/hook subprocesses ([tool.coverage.run] patch); measured ~91%.
      - run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=90
      - run: python examples/demo.py
      - run: python tools/soak.py --iterations 1000
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python tools/smoke_release.py --wheel dist/*.whl
